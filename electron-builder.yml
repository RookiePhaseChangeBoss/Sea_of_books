appId: app.shuyang.desktop
productName: 书洋
copyright: Copyright © 2026 书洋
directories:
  output: release
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  icon: icon.ico
  executableName: 书洋
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 书洋
  unicode: true
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  deleteAppDataOnUninstall: false
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
fileAssociations:
  - ext: epub
    name: EPUB
    description: EPUB 电子书
    role: Viewer
  - ext: mobi
    name: MOBI
    description: MOBI 电子书
    role: Viewer
  - ext: azw
    name: AZW
    description: Kindle 电子书
    role: Viewer
  - ext: azw3
    name: AZW3
    description: AZW3 电子书
    role: Viewer
  - ext: prc
    name: PRC
    description: Mobipocket 电子书
    role: Viewer
